<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0469e3" />
    <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./assets/datacanvas-logo.png" />
    <meta
      name="description"
      content="DataCanvas · 可视化 Pandas 工作台：以可视化方式完成加载、清洗、分组聚合、透视、相关性与图表分析，支持中英双语。Bilingual visual pandas workspace for loading, cleaning, reshaping, aggregating and charting tabular data."
    />
    <title>DataCanvas · 可视化 Pandas 工作台</title>
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      try {
        var savedTheme = localStorage.getItem('datacanvas:theme');
        document.documentElement.dataset.theme = savedTheme === 'dark' ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
